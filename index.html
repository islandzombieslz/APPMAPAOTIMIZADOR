// Geração local para testes: região fiscal 3 (MA/CE/PI), sem consultar dados pessoais.
let cpfState='idle',cpfValue='';
function cpfRandomDigit(){const bytes=new Uint8Array(1);do{crypto.getRandomValues(bytes)}while(bytes[0]>=250);return bytes[0]%10}
function cpfCheckDigit(digits){const sum=digits.reduce((n,d,i)=>n+d*(digits.length+1-i),0),remainder=sum%11;return remainder<2?0:11-remainder}
function generateCpfMA(){let digits;do{digits=Array.from({length:8},cpfRandomDigit);digits.push(3)}while(digits.every(d=>d===digits[0]));digits.push(cpfCheckDigit(digits));digits.push(cpfCheckDigit(digits));return digits.join('')}
function cpfButtonState(state){cpfState=state;const b=$('cpfBtn');b.disabled=state==='loading'||state==='copying';b.classList.toggle('ready',state==='ready');b.classList.toggle('loading',state==='loading'||state==='copying');b.innerHTML=state==='ready'?'CPF ✓':state==='idle'?'CPF':'<span>•••</span>';b.title=state==='ready'?'CPF pronto · tocar para copiar':state==='idle'?'Gerar CPF de teste · MA':'Aguarde';b.setAttribute('aria-label',b.title)}
async function copyCpf(value){if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value);return}const input=document.createElement('textarea');input.value=value;input.style.cssText='position:fixed;opacity:0;pointer-events:none';document.body.appendChild(input);input.select();let ok=false;try{ok=document.execCommand('copy')}finally{input.value='';input.remove()}if(!ok)throw Error('Não foi possível copiar')}
async function cpfAction(){if(cpfState==='loading'||cpfState==='copying')return;if(cpfState==='idle'){cpfButtonState('loading');try{await sleep(80);cpfValue=generateCpfMA();cpfButtonState('ready')}catch{cpfValue='';cpfButtonState('idle');toast('Não foi possível gerar. Tente novamente.')}return}
 const value=cpfValue;cpfButtonState('copying');try{await copyCpf(value);cpfValue='';cpfButtonState('idle');toast('CPF copiado')}catch{cpfButtonState('ready');toast('A cópia não foi permitida. Toque novamente para tentar.')}}
$('cpfBtn').onclick=cpfAction;
