function chooseCatalogPoint(b,index){
 const nr=String(b.numero||'').replace(/\D/g,''),targetStreet=b.logradouro||'',name=nbuilding(b.nome||'');if(!name||name.length<4)return null;
 let best=null;
 for(const o of index){const tags=o.tags||{},mapName=tags.name||tags['addr:housename']||'',mapStreet=tags['addr:street']||'',mapNr=String(tags['addr:housenumber']||'').replace(/\D/g,'');
  const nameSimilarity=mapName?likeness(name,nbuilding(mapName)):0,roadSimilarity=mapStreet&&targetStreet?likeness(mapStreet,targetStreet):0;
  const nrConflict=nr&&mapNr&&nr!==mapNr;
  if(nrConflict||nameSimilarity<.86)continue;
  // Mesmo nome com rua diferente: nunca usar automaticamente.
  if(mapStreet&&targetStreet&&roadSimilarity<.62)continue;
  let score=nameSimilarity*100+(roadSimilarity*42)+(nr&&mapNr&&nr===mapNr?35:0);
  if(!best||score>best.score)best={lat:o.lat,lng:o.lng,quality:roadSimilarity>.7?'Edifício identificado no mapa':'Nome de edifício identificado no mapa',provider:'OpenStreetMap regional',approx:true,score,ref:'https://www.openstreetmap.org/'+o.type+'/'+o.id};
 }
 return best;
}

function cpfButtonState(state){cpfState=state;const b=$('cpfBtn');b.disabled=state==='loading'||state==='copying';b.classList.toggle('ready',state==='ready');b.classList.toggle('loading',state==='loading'||state==='copying');b.innerHTML=state==='ready'?'CPF ✓':state==='idle'?'CPF':'<span>•••</span>';b.title=state==='ready'?'CPF pronto · tocar para copiar':state==='idle'?'Gerar CPF de teste · MA':'Aguarde';b.setAttribute('aria-label',b.title)}

async function cpfAction(){if(cpfState==='loading'||cpfState==='copying')return;if(cpfState==='idle'){cpfButtonState('loading');try{await sleep(80);cpfValue=generateCpfMA();cpfButtonState('ready')}catch{cpfValue='';cpfButtonState('idle');toast('Não foi possível gerar. Tente novamente.')}return}
 const value=cpfValue;cpfButtonState('copying');try{await copyCpf(value);cpfValue='';cpfButtonState('idle');toast('CPF copiado')}catch{cpfButtonState('ready');toast('A cópia não foi permitida. Toque novamente para tentar.')}}
$('cpfBtn').onclick=cpfAction;
$('importBtn').onclick=()=>$('file').click();$('file').onchange=e=>{importFile(e.target.files?.[0]);e.target.value=''};
$('settingsBtn').onclick=settingsView;$('listBtn').onclick=listView;$('optBtn').onclick=()=>optimize('all');$('fitBtn').onclick=()=>fit();$('tiltBtn').onclick=()=>map?.easeTo({pitch:map.getPitch()>10?0:55,duration:350});$('gpsBtn').onclick=gps;$('sheetClose').onclick=closeSheet;$('shade').onclick=closeSheet;
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});applyPermanentCatalog(data);pruneOutOfScope(data);save();initMap();resumeGps();
</script></body></html>
